
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>moonupp | 全球 Web3 流动性层</title>
    <meta name="description" content="moonupp - Lead Bank 授权，连接传统美元与数字流动性的桥梁。">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --sf-blue: #0037ff;
            --sf-purple: #9d00ff;
            --sf-border: rgba(255, 255, 255, 0.12);
            --sf-bg: #050505;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--sf-bg);
            color: #fff;
            overflow: hidden;
            margin: 0;
            height: 100vh;
            width: 100vw;
            position: fixed;
        }

        /* --- Titanium Static Gradient (Main Titles) --- */
        .text-titanium {
            background: linear-gradient(135deg, #f8fafc 0%, #94a3b8 50%, #f8fafc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-size: 200% auto;
            text-shadow: 0 0 30px rgba(255,255,255,0.1);
        }

        /* --- Flowing Text Gradients (Subtitles & Badges) --- */
        .text-flow-blue {
            background: linear-gradient(90deg, #3b82f6, #2dd4bf, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-size: 200% auto;
            animation: textFlow 3s linear infinite;
        }
        .text-flow-vibrant {
            background: linear-gradient(90deg, #6366f1, #a855f7, #ec4899, #6366f1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-size: 200% auto;
            animation: textFlow 4s linear infinite;
        }

        @keyframes textFlow {
            0% { background-position: 0% center; }
            100% { background-position: 200% center; }
        }

        /* --- Dynamic Flowing Border Effect --- */
        .border-gradient-flow {
            position: relative;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 24px;
            overflow: hidden;
            z-index: 1;
        }
        .border-gradient-flow::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(
                from 0deg,
                transparent 0%,
                #3b82f6 25%,
                transparent 50%,
                #9d00ff 75%,
                transparent 100%
            );
            animation: rotateBorder 6s linear infinite;
            z-index: -2;
        }
        .border-gradient-flow::after {
            content: '';
            position: absolute;
            inset: 1px;
            background: var(--sf-bg);
            border-radius: 23px;
            z-index: -1;
        }

        @keyframes rotateBorder {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* --- Global UI --- */
        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            border: 1px solid var(--sf-border);
        }

        /* Preloader */
        #preloader {
            position: fixed;
            inset: 0;
            background: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.8s ease;
        }
        .loader-logo {
            font-size: 3rem;
            font-weight: 900;
            background: linear-gradient(135deg, #fff, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 2rem;
            animation: pulse 2s infinite ease-in-out;
        }
        .loader-bar-container {
            width: 200px;
            height: 1px;
            background: rgba(255,255,255,0.1);
            position: relative;
        }
        .loader-bar {
            width: 0%;
            height: 100%;
            background: #3b82f6;
            animation: load 2s ease forwards;
        }
        @keyframes load { to { width: 100%; } }
        @keyframes pulse { 0%, 100% { opacity: 0.6; transform: scale(0.98); } 50% { opacity: 1; transform: scale(1); } }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.4",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/",
    "vite": "https://esm.sh/vite@^7.3.1",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.3"
  }
}
</script>
</head>
<body>
    <div id="preloader">
        <div class="loader-logo">moonupp</div>
        <div class="loader-bar-container"><div class="loader-bar"></div></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
    <script>
        window.addEventListener('load', () => {
            setTimeout(() => {
                const p = document.getElementById('preloader');
                p.style.opacity = '0';
                setTimeout(() => p.style.display = 'none', 800);
            }, 1500);
        });
    </script>
</body>
</html>


<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>moonupp | 全球 Web3 流动性层</title>
    <meta name="description" content="moonupp - Lead Bank 授权，连接传统美元与数字流动性的桥梁。">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --sf-blue: #0037ff;
            --sf-purple: #9d00ff;
            --sf-border: rgba(255, 255, 255, 0.08);
            --sf-bg: #080808;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--sf-bg);
            color: #fff;
            overflow: hidden;
            margin: 0;
            height: 100vh;
            width: 100vw;
            position: fixed;
        }

        /* --- 恢复高级 Preloader 样式 --- */
        #preloader {
            position: fixed;
            inset: 0;
            background: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .loader-logo {
            font-size: 3rem;
            font-weight: 900;
            letter-spacing: -0.05em;
            background: linear-gradient(135deg, #fff 0%, #3b82f6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 2rem;
            animation: pulse 2s infinite ease-in-out;
        }
        .loader-bar-container {
            width: 240px;
            height: 2px;
            background: rgba(255,255,255,0.1);
            border-radius: 4px;
            overflow: hidden;
            position: relative;
        }
        .loader-bar {
            width: 0%;
            height: 100%;
            background: #3b82f6;
            box-shadow: 0 0 15px #3b82f6;
            animation: load 2.5s cubic-bezier(0.65, 0, 0.35, 1) forwards;
        }
        .loader-sub {
            margin-top: 2rem;
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5em;
            color: rgba(255,255,255,0.3);
            animation: fadeIn 1s ease-out 0.5s both;
        }

        @keyframes load {
            0% { width: 0%; }
            50% { width: 70%; }
            100% { width: 100%; }
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.8; transform: scale(1); filter: blur(0px); }
            50% { opacity: 1; transform: scale(1.05); filter: blur(0.5px); }
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        /* --- 基础 UI 样式 --- */
        .text-gradient {
            background: linear-gradient(135deg, #fff 50%, #818cf8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(16px);
            border: 1px solid var(--sf-border);
            border-radius: 16px;
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.4",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/",
    "vite": "https://esm.sh/vite@^7.3.1",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.3"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
<body>
    <div id="preloader">
        <div class="loader-logo">moonupp</div>
        <div class="loader-bar-container">
            <div class="loader-bar"></div>
        </div>
        <div class="loader-sub">Authorized Banking Rails</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
    <script>
        window.addEventListener('load', () => {
            const preloader = document.getElementById('preloader');
            // 稍作延迟确保 JS 渲染完成
            setTimeout(() => {
                preloader.style.opacity = '0';
                setTimeout(() => preloader.style.display = 'none', 800);
            }, 1800);
        });
    </script>
</body>
</html>
